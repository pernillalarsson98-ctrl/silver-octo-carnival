<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171020">
<title>Min värld | Kreativitet utan gränser</title>
<style>
:root {
  --bg: #171020;
  --panel: #241831;
  --text: #fff7ff;
  --muted: #d4c5dc;
  --pink: #ff5ca8;
  --purple: #bb8cff;
  --lime: #d5ff72;
  --cyan: #73f5e1;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(ellipse at 5% 5%, #63245c 0, transparent 35%),
    radial-gradient(ellipse at 95% 35%, #253f54 0, transparent 32%),
    var(--bg);
  font-family: system-ui, sans-serif;
}
a { color: inherit; }
header {
  position: relative;
  padding: 20px;
  border-bottom: 1px solid #ffffff20;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.logo { font-weight: 900; letter-spacing: 1px; }
.logo span { color: var(--pink); }
nav { display: flex; gap: 15px; flex-wrap: wrap; }
nav a {
  text-decoration: none;
  font-size: 13px;
  color: var(--muted);
}
nav a:hover { color: var(--lime); }
main { max-width: 1000px; margin: auto; padding: 35px 20px 65px; }
.eyebrow {
  color: var(--lime);
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 12px;
  font-weight: 800;
}
.hero { padding: 45px 0 50px; }
h1 {
  max-width: 800px;
  font-size: clamp(44px, 10vw, 88px);
  line-height: .99;
  letter-spacing: -3px;
  margin: 20px 0;
}
.gradient {
  background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.intro {
  max-width: 650px;
  font-size: 17px;
  line-height: 1.8;
  color: var(--muted);
}
.pill {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 18px;
  border-radius: 30px;
  background: var(--lime);
  color: #21152a;
  font-weight: 800;
  text-decoration: none;
}
section { padding: 28px 0; scroll-margin-top: 20px; }
.section-head { margin-bottom: 18px; }
h2 { font-size: clamp(25px, 5vw, 38px); margin: 8px 0; }
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}
.card {
  background: #241831df;
  border: 1px solid #ffffff24;
  border-radius: 20px;
  padding: 22px;
  min-height: 180px;
  box-shadow: 0 12px 35px #00000015;
}
.card:nth-child(3n+1) { border-top: 3px solid var(--pink); }
.card:nth-child(3n+2) { border-top: 3px solid var(--lime); }
.card:nth-child(3n) { border-top: 3px solid var(--cyan); }
.symbol { font-size: 28px; }
.card h3 { margin: 14px 0 8px; font-size: 20px; }
.card p, .copy {
  color: var(--muted);
  line-height: 1.8;
  font-size: 15px;
}
.story {
  border-radius: 22px;
  padding: 25px;
  background: linear-gradient(135deg, #ff5ca81c, #bb8cff20, #73f5e11a);
  border: 1px solid #ffffff25;
}
.contact {
  text-align: center;
  padding: 35px 20px;
  margin-top: 35px;
  border-radius: 24px;
  background: #d5ff7212;
  border: 1px solid #d5ff7244;
}
.contact .pill { margin-top: 8px; }
footer {
  text-align: center;
  padding: 25px 10px;
  color: #b9a9c4;
  font-size: 12px;
  border-top: 1px solid #ffffff20;
}
@media (max-width: 500px) {
  header { align-items: flex-start; }
  nav { gap: 10px; }
  h1 { letter-spacing: -1.5px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">MIN <span>VÄRLD ✦</span></div>
  <nav aria-label="Huvudmeny">
    <a href="mailto:pernillalarsson98@gmail.com" style="display:inline-block; padding:10px 20px; background-color:#00ff66; color:#000; font-weight:bold; text-decoration:none; border-radius:4px;">Mejla mig (pernillalarsson98@gmail.com)</a>
  </section>
</main>
<footer>Min värld ✦ Personligt skapad med HTML, CSS och Python</footer>
</body>
</html>
